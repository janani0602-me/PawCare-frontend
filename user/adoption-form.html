<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoption Request – PawCare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>
  <nav class="user-navbar" id="userNav"></nav>

  <section class="container section">
    <div class="page-heading">
      <h1>Adoption Request</h1>
      <p>Fill in your details and our team will review your application.</p>
    </div>

    <div class="form-card">
      <div id="petBanner"></div>

      <form id="adoptionForm" onsubmit="submitAdoptionForm(event)">
        <input type="hidden" id="adoptPetId">

        <div class="form-row">
          <div class="form-group">
            <label>Full Name <span class="req">*</span></label>
            <input type="text" id="fullName" required>
          </div>
          <div class="form-group">
            <label>Email <span class="req">*</span></label>
            <input type="email" id="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phone Number <span class="req">*</span></label>
            <input type="tel" id="phone" required>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city">
          </div>
        </div>

        <div class="form-group">
          <label>Address <span class="req">*</span></label>
          <input type="text" id="address" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Occupation</label>
            <input type="text" id="occupation">
          </div>
          <div class="form-group">
            <label>Home Type</label>
            <select id="homeType">
              <option value="Apartment">Apartment</option>
              <option value="Independent House">Independent House</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Previous Pet Experience</label>
            <input type="text" id="experience" placeholder="e.g. Had a dog for 5 years">
          </div>
          <div class="form-group">
            <label>Do you have other pets?</label>
            <select id="otherPets">
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Preferred Contact Method</label>
          <select id="contactMethod">
            <option value="Email">Email</option>
            <option value="Phone">Phone</option>
            <option value="WhatsApp">WhatsApp</option>
          </select>
        </div>

        <div class="form-group">
          <label>Why do you want to adopt this pet? <span class="req">*</span></label>
          <textarea id="reason" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">
          <i class="fas fa-paper-plane"></i> Submit Adoption Request
        </button>
      </form>
    </div>
  </section>

  <div class="modal-overlay" id="successModal">
    <div class="modal" id="successMsg"></div>
  </div>

  <footer class="user-footer">
    <div class="footer-copy">© 2026 PawCare. All rights reserved.</div>
  </footer>

  <script src="../shared/storage.js"></script>
  <script src="js/user.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initAdoptionForm);</script>
</body>
</html>

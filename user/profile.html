<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – PawCare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body>
  <nav class="user-navbar" id="userNav"></nav>

  <section class="container section">
    <div class="profile-wrap">
      <aside class="profile-card">
        <div class="profile-avatar" id="avatarInitial">U</div>
        <h2 id="profileName">User</h2>
        <div class="role" id="profileEmail">email</div>
        <div class="profile-menu">
          <button class="active"><i class="fas fa-user"></i> Edit Profile</button>
          <a href="requests.html" style="text-decoration:none;color:inherit"><button><i class="fas fa-clipboard-list"></i> My Requests (<span id="reqCount">0</span>)</button></a>
          <button onclick="userLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      </aside>

      <div class="profile-content">
        <h2 style="margin-bottom:1.5rem">Edit Profile</h2>
        <form onsubmit="saveProfile(event)">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="pName" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="pEmail" disabled style="opacity:.65">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="pPhone">
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" id="pAddress">
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="user-footer">
    <div class="footer-copy">© 2026 PawCare. All rights reserved.</div>
  </footer>

  <script src="../shared/storage.js"></script>
  <script src="js/user.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initProfile();
      const u = getCurrentUser();
      if (u) document.getElementById('avatarInitial').textContent = (u.name || 'U')[0].toUpperCase();
    });
  </script>
</body>
</html>

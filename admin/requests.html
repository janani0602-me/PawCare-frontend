<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoption Requests – PawCare Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="topbar"></header>
      <main class="admin-content">
        <div class="page-header">
          <div><h1>Adoption Requests</h1><p>Review and manage user adoption requests</p></div>
        </div>
        <div class="card" style="padding:0">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Request ID</th><th>User</th><th>Pet</th><th>Date</th>
                  <th>Contact</th><th>Status</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-overlay" id="viewRequestModal">
    <div class="modal">
      <button class="modal-close" onclick="closeAdminModal('viewRequestModal')">&times;</button>
      <div id="viewRequestContent"></div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;text-align:center">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmMsg" style="color:var(--secondary);margin-bottom:1.5rem"></p>
      <div style="display:flex;gap:.6rem;justify-content:center">
        <button class="btn btn-outline" onclick="closeAdminModal('confirmModal')">Cancel</button>
        <button class="btn btn-primary" id="confirmYes">Yes</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../shared/storage.js"></script>
  <script src="js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initAdminRequests);</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – PawCare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-auth-wrap">
    <div class="admin-auth-card">
      <div class="admin-auth-logo">
        <div class="mark"><i class="fas fa-user-shield"></i></div>
        <h1>PawCare Admin</h1>
        <p>Administrator access only</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="adminUser" placeholder="admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPass" placeholder="••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.75rem">
          <i class="fas fa-sign-in-alt"></i> Login to Admin Panel
        </button>
      </form>

      <div style="text-align:center;margin-top:1.3rem;font-size:.82rem;color:var(--secondary)">
        <a href="../user/index.html" style="color:var(--primary)"><i class="fas fa-arrow-left"></i> Back to User Site</a>
      </div>
      <div style="text-align:center;margin-top:1rem;font-size:.78rem;color:var(--secondary);background:var(--gray);padding:.6rem;border-radius:10px">
        Demo: <strong>admin</strong> / <strong>1234</strong>
      </div>
    </div>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="js/admin.js"></script>
  <script>document.addEventListener('DOMContentLoaded', initAdminLogin);</script>
</body>
</html>
